name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # The tool modules shell out to PowerShell, the registry and winget, and the tests read the
    # compiled dist/, so this has to run on a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
